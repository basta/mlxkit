[project]
name = "mlxkit"
version = "0.1.0"
description = "Edit and run MATLAB live scripts (.mlx) without MATLAB, using GNU Octave"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "mat-io"]

[project.optional-dependencies]
symbolic = ["sympy"]  # used by Octave's symbolic package for MATLAB `syms` code
jupyter = ["ipykernel>=6", "jupyter_client>=7", "nbformat>=5"]

[project.scripts]
mlx = "mlxkit.cli:main"

[dependency-groups]
dev = ["pytest", "jupyterlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlxkit"]
